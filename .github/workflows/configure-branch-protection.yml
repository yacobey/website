name: Configure Branch Protection

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to protect (default: main)"
        required: false
        default: "main"

jobs:
  configure:
    name: Set Required Status Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Configure branch protection via GitHub API
        env:
          GH_TOKEN: ${{ secrets.BRANCH_PROTECTION_PAT }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.inputs.branch }}
        run: |
          echo "Configuring branch protection for '$BRANCH' on $REPO..."
          curl -X PUT \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/branches/$BRANCH/protection" \
            -d '{
              "required_status_checks": {
                "strict": true,
                "contexts": [
                  "npm audit",
                  "CodeQL Analysis (javascript-typescript)"
                ]
              },
              "enforce_admins": true,
              "required_pull_request_reviews": null,
              "restrictions": null
            }' \
            --fail-with-body
          echo "Branch protection configured successfully."
