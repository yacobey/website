name: Security Scanning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [npm-audit, codeql]
    if: ${{ always() && (needs.npm-audit.result == 'failure' || needs.codeql.result == 'failure') }}
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Post PR comment on failure
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const failedJobs = [];
            if ('${{ needs.npm-audit.result }}' === 'failure') failedJobs.push('**npm audit** — dependency vulnerabilities detected at high severity or above');
            if ('${{ needs.codeql.result }}' === 'failure') failedJobs.push('**CodeQL Analysis** — static security analysis found issues');

            const summary = failedJobs.map(j => `- ${j}`).join('\n');
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const body = [
              '## :rotating_light: Security scan failed',
              '',
              'The following security checks did not pass:',
              '',
              summary,
              '',
              `[View the full run log](${runUrl}) for details.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Send Slack alert
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": ":rotating_light: *Security scan failed* on `${{ github.repository }}`",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Security scan failed*\n*Repo:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Triggered by:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View failed run>*"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send email alert via SendGrid
        if: ${{ always() && secrets.SENDGRID_API_KEY != '' && secrets.SENDGRID_FROM_EMAIL != '' && secrets.SECURITY_ALERT_EMAIL != '' }}
        run: |
          FAILED_JOBS=""
          if [ "${{ needs.npm-audit.result }}" = "failure" ]; then
            FAILED_JOBS="npm audit"
          fi
          if [ "${{ needs.codeql.result }}" = "failure" ]; then
            FAILED_JOBS="${FAILED_JOBS:+$FAILED_JOBS, }CodeQL Analysis"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Build a JSON array from the comma-separated SECURITY_ALERT_EMAIL secret.
          # Each entry is trimmed of whitespace so "alice@example.com, bob@example.com"
          # and "alice@example.com,bob@example.com" both work correctly.
          TO_JSON=""
          INVALID_FOUND=0
          IFS=',' read -ra RAW_EMAILS <<< "${{ secrets.SECURITY_ALERT_EMAIL }}"
          for raw in "${RAW_EMAILS[@]}"; do
            trimmed="$(echo "$raw" | xargs)"
            [ -z "$trimmed" ] && continue
            # Validate: must contain exactly one '@', with non-empty local part
            # and a domain that contains at least one '.'
            if ! echo "$trimmed" | grep -qE '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'; then
              echo "ERROR: '$trimmed' is not a valid email address. Fix SECURITY_ALERT_EMAIL and re-run."
              INVALID_FOUND=1
            fi
            TO_JSON="${TO_JSON:+$TO_JSON,}{\"email\":\"$trimmed\"}"
          done

          if [ "$INVALID_FOUND" -eq 1 ]; then
            echo "One or more recipient addresses in SECURITY_ALERT_EMAIL are invalid. Aborting email alert."
            exit 1
          fi

          TO_JSON="[$TO_JSON]"

          if [ "$TO_JSON" = "[]" ]; then
            echo "SECURITY_ALERT_EMAIL contains no valid addresses after parsing; skipping email alert."
            exit 0
          fi

          curl --silent --show-error --fail \
            --request POST \
            --url https://api.sendgrid.com/v3/mail/send \
            --header "Authorization: Bearer ${{ secrets.SENDGRID_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data "{
              \"personalizations\": [{
                \"to\": $TO_JSON,
                \"subject\": \"[Security Alert] Scan failed on ${{ github.repository }}\"
              }],
              \"from\": {\"email\": \"${{ secrets.SENDGRID_FROM_EMAIL }}\"},
              \"content\": [{
                \"type\": \"text/plain\",
                \"value\": \"Security scan failed\\n\\nFailed job(s): ${FAILED_JOBS}\\nRepository: ${{ github.repository }}\\nBranch: ${{ github.ref_name }}\\nTriggered by: ${{ github.actor }}\\n\\nView the failed run:\\n${RUN_URL}\"
              }]
            }"
