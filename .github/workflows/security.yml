name: Security Scanning

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  npm-audit:
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit
        run: npm audit --audit-level=high

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  send-scan-summary:
    name: Send scan summary email
    runs-on: ubuntu-latest
    needs: [npm-audit, codeql]
    permissions:
      actions: read
    # Two optional repository variables control when summary emails are sent
    # (Settings > Variables > Actions):
    #
    # SECURITY_SUMMARY_FILTER_JOBS — comma-separated list of job names whose failures
    #   should trigger a summary email (e.g. "npm-audit" or "npm-audit,codeql").
    #   When set, an email is sent only if at least one listed job failed. Unlisted
    #   jobs are ignored. Takes precedence over SECURITY_SUMMARY_ON_FAILURE_ONLY.
    #
    # SECURITY_SUMMARY_ON_FAILURE_ONLY — set to "true" to suppress summary emails when
    #   all scans pass. Has no effect when SECURITY_SUMMARY_FILTER_JOBS is set.
    if: ${{ always() && secrets.SENDGRID_API_KEY != '' && secrets.SENDGRID_FROM_EMAIL != '' && secrets.SECURITY_ALERT_EMAIL != '' }}
    steps:
      - name: Find latest scan-history artifact from any branch
        id: find-history
        uses: actions/github-script@v7
        with:
          script: |
            const { data: { workflow_runs } } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'security.yml',
              per_page: 20,
              status: 'completed'
            });
            for (const run of workflow_runs) {
              if (run.id === context.runId) continue;
              const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              const hist = artifacts.find(a => a.name === 'scan-history' && !a.expired);
              if (hist) {
                core.setOutput('run-id', String(run.id));
                return;
              }
            }
            core.setOutput('run-id', '');

      - name: Download scan history artifact
        if: steps.find-history.outputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          name: scan-history
          run-id: ${{ steps.find-history.outputs.run-id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build history, send summary email via SendGrid, and save history
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          NPM_RESULT="${{ needs.npm-audit.result }}"
          CODEQL_RESULT="${{ needs.codeql.result }}"

          NPM_ICON="✅"
          [ "$NPM_RESULT" = "failure" ] && NPM_ICON="❌"
          [ "$NPM_RESULT" = "skipped" ] && NPM_ICON="⏭️"
          [ "$NPM_RESULT" = "cancelled" ] && NPM_ICON="🚫"

          CODEQL_ICON="✅"
          [ "$CODEQL_RESULT" = "failure" ] && CODEQL_ICON="❌"
          [ "$CODEQL_RESULT" = "skipped" ] && CODEQL_ICON="⏭️"
          [ "$CODEQL_RESULT" = "cancelled" ] && CODEQL_ICON="🚫"

          if [ "$NPM_RESULT" = "failure" ] || [ "$CODEQL_RESULT" = "failure" ]; then
            OVERALL="FAILED"
          else
            OVERALL="PASSED"
          fi

          # Per-job filtering: SECURITY_SUMMARY_FILTER_JOBS is an optional comma-separated list
          # of job names (e.g. "npm-audit,codeql") whose failures should trigger a summary.
          # When set, a summary email is sent only if at least one listed job failed.
          # When absent or empty, fall back to the SECURITY_SUMMARY_ON_FAILURE_ONLY behaviour.
          # Repository variables are set under Settings > Variables > Actions.
          FILTER_JOBS="${{ vars.SECURITY_SUMMARY_FILTER_JOBS }}"
          if [ -n "$FILTER_JOBS" ]; then
            FILTER_TRIGGERED=0
            IFS=',' read -ra FILTER_LIST <<< "$FILTER_JOBS"
            for job_name in "${FILTER_LIST[@]}"; do
              trimmed_job="$(echo "$job_name" | xargs)"
              job_result="$(echo "$NEEDS_JSON" | jq -r --arg job "$trimmed_job" '.[$job].result // "not-found"')"
              if [ "$job_result" = "failure" ]; then
                FILTER_TRIGGERED=1
              fi
            done
            if [ "$FILTER_TRIGGERED" -eq 0 ]; then
              echo "SECURITY_SUMMARY_FILTER_JOBS is set but none of the listed jobs failed — skipping summary email."
              exit 0
            fi
          else
            # Honour the opt-in variable: skip summary emails on success when set to "true".
            if [ "${{ vars.SECURITY_SUMMARY_ON_FAILURE_ONLY }}" = "true" ] && [ "$OVERALL" = "PASSED" ]; then
              echo "SECURITY_SUMMARY_ON_FAILURE_ONLY is true and all scans passed — skipping summary email."
              exit 0
            fi
          fi

          RUN_DATE="$(date -u '+%Y-%m-%d %H:%M UTC')"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Append current run to history file (format: date|overall|npm|codeql|url|branch)
          HISTORY_FILE="scan-history.txt"
          NEW_ENTRY="${RUN_DATE}|${OVERALL}|npm-audit=${NPM_RESULT}|codeql=${CODEQL_RESULT}|${RUN_URL}|${{ github.ref_name }}"
          echo "$NEW_ENTRY" >> "$HISTORY_FILE"

          # Keep only the last 5 entries
          TOTAL_LINES=$(wc -l < "$HISTORY_FILE")
          if [ "$TOTAL_LINES" -gt 5 ]; then
            tail -5 "$HISTORY_FILE" > "${HISTORY_FILE}.tmp" && mv "${HISTORY_FILE}.tmp" "$HISTORY_FILE"
          fi

          # Build trend section from history (oldest → newest)
          TREND_SECTION="Recent scan history (last 5 runs across all branches, oldest first):\n"
          TREND_SECTION="${TREND_SECTION}--------------------------------------------------------------------\n"
          while IFS='|' read -r h_date h_overall h_npm h_codeql h_url h_branch; do
            h_npm_icon="✅"
            echo "$h_npm" | grep -q "=failure"   && h_npm_icon="❌"
            echo "$h_npm" | grep -q "=skipped"   && h_npm_icon="⏭️"
            echo "$h_npm" | grep -q "=cancelled" && h_npm_icon="🚫"
            h_codeql_icon="✅"
            echo "$h_codeql" | grep -q "=failure"   && h_codeql_icon="❌"
            echo "$h_codeql" | grep -q "=skipped"   && h_codeql_icon="⏭️"
            echo "$h_codeql" | grep -q "=cancelled" && h_codeql_icon="🚫"
            TREND_SECTION="${TREND_SECTION}  ${h_date}  [${h_branch}]  ${h_overall}  |  ${h_npm_icon} npm audit  ${h_codeql_icon} CodeQL\n"
          done < "$HISTORY_FILE"
          TREND_SECTION="${TREND_SECTION}--------------------------------------------------------------------"

          BODY="Security Scan Summary — ${OVERALL}\n\nRepository: ${{ github.repository }}\nBranch: ${{ github.ref_name }}\nTriggered by: ${{ github.actor }}\nRun: ${RUN_URL}\n\nJob results:\n  ${NPM_ICON} npm audit — ${NPM_RESULT}\n  ${CODEQL_ICON} CodeQL Analysis — ${CODEQL_RESULT}\n\n${TREND_SECTION}"

          TO_JSON=""
          IFS=',' read -ra RAW_EMAILS <<< "${{ secrets.SECURITY_ALERT_EMAIL }}"
          for raw in "${RAW_EMAILS[@]}"; do
            trimmed="$(echo "$raw" | xargs)"
            [ -z "$trimmed" ] && continue
            TO_JSON="${TO_JSON:+$TO_JSON,}{\"email\":\"$trimmed\"}"
          done
          TO_JSON="[$TO_JSON]"

          if [ "$TO_JSON" = "[]" ]; then
            echo "SECURITY_ALERT_EMAIL contains no valid addresses after parsing; skipping summary email."
            exit 0
          fi

          SUMMARY_FROM_EMAIL="${{ secrets.SENDGRID_FROM_EMAIL }}"
          if ! echo "$SUMMARY_FROM_EMAIL" | grep -qE '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'; then
            echo "ERROR: '$SUMMARY_FROM_EMAIL' is not a valid sender address. Fix SENDGRID_FROM_EMAIL and re-run."
            exit 1
          fi

          SUMMARY_BODY_FILE=$(mktemp)
          SUMMARY_HTTP_CODE=$(curl --silent --show-error \
            -o "$SUMMARY_BODY_FILE" \
            -w "%{http_code}" \
            --request POST \
            --url https://api.sendgrid.com/v3/mail/send \
            --header "Authorization: Bearer ${{ secrets.SENDGRID_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data "{
              \"personalizations\": [{
                \"to\": $TO_JSON,
                \"subject\": \"[Security Scan] ${OVERALL} — ${{ github.repository }}\"
              }],
              \"from\": {\"email\": \"$SUMMARY_FROM_EMAIL\"},
              \"content\": [{
                \"type\": \"text/plain\",
                \"value\": \"${BODY}\"
              }]
            }")
          SUMMARY_RESPONSE=$(cat "$SUMMARY_BODY_FILE")
          rm -f "$SUMMARY_BODY_FILE"
          if [ "$SUMMARY_HTTP_CODE" -ge 200 ] && [ "$SUMMARY_HTTP_CODE" -lt 300 ]; then
            echo "Summary email sent successfully."
          else
            echo "SendGrid API returned HTTP $SUMMARY_HTTP_CODE."
            if echo "$SUMMARY_RESPONSE" | grep -qi "sender identity\|sender not verified\|does not match a verified Sender Identity"; then
              echo "WARNING: The sender address '$SUMMARY_FROM_EMAIL' appears to be unverified in SendGrid."
              echo "A syntactically valid address still requires Sender Identity verification before SendGrid will accept it."
              echo "To verify your sender, visit: https://app.sendgrid.com/settings/sender_auth"
              echo "See SECURITY_ALERT_RECIPIENTS.md for details."
              echo "Continuing without sending the summary email."
            else
              echo "SendGrid error response: $SUMMARY_RESPONSE"
              exit 1
            fi
          fi

      - name: Upload scan history artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-history
          path: scan-history.txt
          retention-days: 90

  notify-on-failure:
    name: Notify on failure
    runs-on: ubuntu-latest
    needs: [npm-audit, codeql]
    if: ${{ always() && (needs.npm-audit.result == 'failure' || needs.codeql.result == 'failure') }}
    permissions:
      pull-requests: write
      issues: write
    steps:
      - name: Post PR comment on failure
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const failedJobs = [];
            if ('${{ needs.npm-audit.result }}' === 'failure') failedJobs.push('**npm audit** — dependency vulnerabilities detected at high severity or above');
            if ('${{ needs.codeql.result }}' === 'failure') failedJobs.push('**CodeQL Analysis** — static security analysis found issues');

            const summary = failedJobs.map(j => `- ${j}`).join('\n');
            const runUrl = `${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            const body = [
              '## :rotating_light: Security scan failed',
              '',
              'The following security checks did not pass:',
              '',
              summary,
              '',
              `[View the full run log](${runUrl}) for details.`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Send Slack alert
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.0
        with:
          payload: |
            {
              "text": ":rotating_light: *Security scan failed* on `${{ github.repository }}`",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ":rotating_light: *Security scan failed*\n*Repo:* `${{ github.repository }}`\n*Branch:* `${{ github.ref_name }}`\n*Triggered by:* ${{ github.actor }}\n*<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View failed run>*"
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Send email alert via SendGrid
        if: ${{ always() && secrets.SENDGRID_API_KEY != '' && secrets.SENDGRID_FROM_EMAIL != '' && secrets.SECURITY_ALERT_EMAIL != '' }}
        run: |
          FAILED_JOBS=""
          if [ "${{ needs.npm-audit.result }}" = "failure" ]; then
            FAILED_JOBS="npm audit"
          fi
          if [ "${{ needs.codeql.result }}" = "failure" ]; then
            FAILED_JOBS="${FAILED_JOBS:+$FAILED_JOBS, }CodeQL Analysis"
          fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          # Validate the sender address before doing anything else.
          FROM_EMAIL="${{ secrets.SENDGRID_FROM_EMAIL }}"
          if ! echo "$FROM_EMAIL" | grep -qE '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'; then
            echo "ERROR: '$FROM_EMAIL' is not a valid sender address. Fix SENDGRID_FROM_EMAIL and re-run."
            exit 1
          fi

          # Build one personalization entry per recipient from the comma-separated
          # SECURITY_ALERT_EMAIL secret so each person sees only their own address
          # in the To field (no visible CC to other recipients).
          #
          # Example: SECURITY_ALERT_EMAIL = "alice@example.com, bob@example.com"
          # Produces:
          #   "personalizations": [
          #     {"to": [{"email": "alice@example.com"}], "subject": "..."},
          #     {"to": [{"email": "bob@example.com"}], "subject": "..."}
          #   ]
          # Alice receives the email addressed only to herself; same for Bob.
          PERSONALIZATIONS_JSON=""
          INVALID_FOUND=0
          IFS=',' read -ra RAW_EMAILS <<< "${{ secrets.SECURITY_ALERT_EMAIL }}"
          for raw in "${RAW_EMAILS[@]}"; do
            trimmed="$(echo "$raw" | xargs)"
            [ -z "$trimmed" ] && continue
            # Validate: must contain exactly one '@', with non-empty local part
            # and a domain that contains at least one '.'
            if ! echo "$trimmed" | grep -qE '^[^@[:space:]]+@[^@[:space:]]+\.[^@[:space:]]+$'; then
              echo "ERROR: '$trimmed' is not a valid email address. Fix SECURITY_ALERT_EMAIL and re-run."
              INVALID_FOUND=1
            fi
            ENTRY="{\"to\":[{\"email\":\"$trimmed\"}],\"subject\":\"[Security Alert] Scan failed on ${{ github.repository }}\"}"
            PERSONALIZATIONS_JSON="${PERSONALIZATIONS_JSON:+$PERSONALIZATIONS_JSON,}$ENTRY"
          done

          if [ "$INVALID_FOUND" -eq 1 ]; then
            echo "One or more recipient addresses in SECURITY_ALERT_EMAIL are invalid. Aborting email alert."
            exit 1
          fi

          PERSONALIZATIONS_JSON="[$PERSONALIZATIONS_JSON]"

          if [ "$PERSONALIZATIONS_JSON" = "[]" ]; then
            echo "SECURITY_ALERT_EMAIL contains no valid addresses after parsing; skipping email alert."
            exit 0
          fi

          ALERT_BODY_FILE=$(mktemp)
          ALERT_HTTP_CODE=$(curl --silent --show-error \
            -o "$ALERT_BODY_FILE" \
            -w "%{http_code}" \
            --request POST \
            --url https://api.sendgrid.com/v3/mail/send \
            --header "Authorization: Bearer ${{ secrets.SENDGRID_API_KEY }}" \
            --header "Content-Type: application/json" \
            --data "{
              \"personalizations\": $PERSONALIZATIONS_JSON,
              \"from\": {\"email\": \"$FROM_EMAIL\"},
              \"content\": [{
                \"type\": \"text/plain\",
                \"value\": \"Security scan failed\\n\\nFailed job(s): ${FAILED_JOBS}\\nRepository: ${{ github.repository }}\\nBranch: ${{ github.ref_name }}\\nTriggered by: ${{ github.actor }}\\n\\nView the failed run:\\n${RUN_URL}\"
              }]
            }")
          ALERT_RESPONSE=$(cat "$ALERT_BODY_FILE")
          rm -f "$ALERT_BODY_FILE"
          if [ "$ALERT_HTTP_CODE" -ge 200 ] && [ "$ALERT_HTTP_CODE" -lt 300 ]; then
            echo "Email alert sent successfully."
          else
            echo "SendGrid API returned HTTP $ALERT_HTTP_CODE."
            if echo "$ALERT_RESPONSE" | grep -qi "sender identity\|sender not verified\|does not match a verified Sender Identity"; then
              echo "WARNING: The sender address '$FROM_EMAIL' appears to be unverified in SendGrid."
              echo "A syntactically valid address still requires Sender Identity verification before SendGrid will accept it."
              echo "To verify your sender, visit: https://app.sendgrid.com/settings/sender_auth"
              echo "See SECURITY_ALERT_RECIPIENTS.md for details."
              echo "Continuing without sending the email alert."
            else
              echo "SendGrid error response: $ALERT_RESPONSE"
              exit 1
            fi
          fi
